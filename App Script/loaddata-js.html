function loadData() {
    google.script.run.withSuccessHandler(function(data) {
        const tableBody = document.getElementById('dataTable').getElementsByTagName('tbody')[0];
        tableBody.innerHTML = '';
        data.forEach(function(row) {
            const status = row.Status ? row.Status.toLowerCase() : 'unknown';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 600;">${row.Tafel}</td>
                <td>${row.Persons}</td>
                <td>
                    <label class="switch">
                        <input type="checkbox" ${status === 'open' ? 'checked' : ''} onchange="toggleStatus(event, '${row.Tafel}')">
                        <span class="slider round"></span>
                    </label>
                </td>
                <td class='pincode-cell'>${row.Pincode}</td>
                <td  style="display:none;">${row.URL || 'No URL'}</td>`;  // Include hidden URL for QR code generation
            tableBody.appendChild(tr);
        });
      

    document.getElementById('loadingOverlay').style.display = 'none';

    }).getSheetData();  // This should correspond to a server-side Apps Script function
}

function setupEventHandlers() {
      const personPanel = document.getElementById('personPanel');

    const dataTable = document.getElementById('dataTable');
        confirmButton.addEventListener('click', () => {
        handleConfirmButtonClick();
    });

    decreaseButton.addEventListener('click', () => {
        let count = Math.max(1, parseInt(personCountInput.value) - 1);
        personCountInput.value = count;
    });

    increaseButton.addEventListener('click', () => {
        let count = parseInt(personCountInput.value) + 1;
        personCountInput.value = count;
    });
    
    dataTable.addEventListener('click', function(event) {
        if (event.target.nodeName === "TD") {
            if (event.target.classList.contains('pincode-cell')) {
                showPincodePanel(event.target);
            } else if (event.target.cellIndex === 1) {  // Assuming 'Persons' column
                showPersonPanel(event.target, event.target.textContent.trim());
            }
        }
    });

// Click outside to hide panels, but allow them to open when appropriate
window.addEventListener('click', function(e) {
    const personPanel = document.getElementById('personPanel');
    const pincodePanel = document.getElementById('pincodePanel');
    const dataTable = document.getElementById('dataTable');

    // Check if the clicked element is a cell that should show the person panel
    let isPersonCell = e.target.cellIndex === 1 && e.target.nodeName === "TD";

    // Define conditions for when to hide panels
    const isClickOutsidePersonPanel = !personPanel.contains(e.target) && !isPersonCell;
    const isClickOutsidePincodePanel = !pincodePanel.contains(e.target) && !e.target.classList.contains('pincode-cell');

    // Hide person panel if click is outside and not on a person cell
    if (isClickOutsidePersonPanel) {
        hidePersonPanel();
    }

    // Hide pincode panel if click is outside and not on a pincode cell
    if (isClickOutsidePincodePanel) {
        hidePincodePanel();
    }

    // If the click is on a person cell, show the person panel
    if (isPersonCell) {
        showPersonPanel(e.target, e.target.textContent.trim());
    }
});
}

function handleSearch() {
    const searchQuery = this.value.toLowerCase();
    const tableRows = document.getElementById('dataTable').getElementsByTagName('tbody')[0].rows;
    Array.from(tableRows).forEach(row => {
        const cells = Array.from(row.cells);
        const matchesQuery = cells.some(cell => cell.textContent.toLowerCase().includes(searchQuery));
        row.style.display = matchesQuery ? '' : 'none';
    });
}

function showPincodePanel(targetCell) {
    const panel = document.getElementById('pincodePanel');
    const input = panel.querySelector('input[type="number"]');
    const saveButton = document.getElementById('savePincodeButton');
    const qrCodeButton = document.getElementById('generateQrCodeButton');
    const rowIndex = targetCell.parentNode.rowIndex;
    // const rowInSheet = rowIndex + 2;
    const tafel = targetCell.parentNode.cells[0].textContent.trim();
    panel.style.top = `${targetCell.getBoundingClientRect().top + window.scrollY}px`;
    panel.style.left = `${targetCell.getBoundingClientRect().right + window.scrollX}px`;
    panel.style.display = 'block';
    input.value = targetCell.textContent.trim(); // Prefill the current pincode

    saveButton.onclick = () => {
        updatePincode(rowIndex, input.value, targetCell);
        
        hidePincodePanel();
    };
    qrCodeButton.onclick = () => {
      const codeUrl  = targetCell.parentNode.cells[4].textContent.trim() + input.value;
      
        generateQRCode(codeUrl, tafel);
        document.querySelector('#loadingOverlay').style.display = 'block';
        hidePincodePanelWithoutMakeQR();
    };
}

function updatePincode(rowIndex, newPincode, targetCell) {
    // First, check the validity of the new pincode
    if (newPincode.length >= 3 && newPincode.length <= 4) {
        // Optimistically update the UI before the server response
        targetCell.textContent = newPincode; // Update the display immediately

        // Send the update to the server
        google.script.run.withSuccessHandler(function() {
            console.log("Pincode updated successfully on the server.");
            // Further actions can be taken here if the server confirms the update
        }).withFailureHandler(function(error) {
            console.error('Failed to update pincode:', error);
            // Revert the UI changes if necessary or show an error message
            targetCell.textContent = "Update failed"; // Consider reverting to original or handling differently
            alert("Failed to update pincode. Please try again.");
        }).updatePincode(rowIndex + 2, newPincode); // Adjust rowIndex as needed and call the server-side function
    } else {
        alert("The pincode must be 3 or 4 digits.");
    }
}


function toggleStatus(event, tableId) {
    // Determine the status based on the checkbox
    const status = event.target.checked ? 'open' : 'afgesloten';

    // Navigate up to the parent row of the checkbox
    const row = event.target.closest('tr');
    if (!row) {
        console.error('Error: Could not find the row associated with this checkbox.');
        return;
    }

    // Assuming the pincode is in the fourth cell (index 3)
    const pincodeCell = row.cells[3];
    if (!pincodeCell) {
        console.error('Error: Could not find the pincode cell.');
        return;
    }

    // Retrieve the pincode value
    const pincode = pincodeCell.textContent;

    // Now pass the status, tableId, and pincode to the Google Apps Script function
    google.script.run.withSuccessHandler(function() {
        console.log('Status updated successfully.');
    }).withFailureHandler(function(error) {
        console.error('Error updating status:', error);
    }).updateTableStatus(tableId, status, '', pincode);
}
